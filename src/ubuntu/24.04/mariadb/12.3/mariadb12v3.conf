# 容器级配置（KEY=VALUE）。
# 改 MARIADB_BACKUP_ENABLE / MARIADB_BACKUP_CRON 后 docker restart 容器，
# 才会重写 /etc/cron.d/mariadb-backup。
# 改 MARIADB_BACKUP_KEEP_DAYS / MARIADB_BACKUP_DIR 下次备份即生效。
# 手动执行不看 MARIADB_BACKUP_ENABLE：
#   docker exec mariadb12v3 /usr/local/sbin/mariadb-backup.sh

MARIADB_BACKUP_ENABLE=0
MARIADB_BACKUP_CRON="0 3 * * *"
MARIADB_BACKUP_KEEP_DAYS=30
MARIADB_BACKUP_DIR=/wwwdata/misc/backup
