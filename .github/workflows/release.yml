name: release

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build from src path
    if: "contains(github.event.head_commit.message, 'release ')"

    runs-on: ubuntu-24.04

    env:
      GIT_MSG: ${{ github.event.head_commit.message }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Parse release path
        id: parse
        run: |
          set -eu
          REST=$(printf '%s\n' "$GIT_MSG" | awk '{
            for (i = 1; i <= NF; i++) {
              if ($i == "release") {
                print $(i + 1), $(i + 2)
                exit
              }
            }
          }')
          DIR=$(printf '%s\n' "$REST" | awk '{print $1}')
          VER=$(printf '%s\n' "$REST" | awk '{print $2}')

          if [ -z "$DIR" ]; then
            echo "No release token found; skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s\n' "$DIR" | grep -qE '^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$'; then
            echo "Not a four-segment path ($DIR); skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "/$DIR/" in
            */./*|*/../*)
              echo "Invalid path segment in $DIR"
              exit 1
              ;;
          esac

          if ! printf '%s\n' "$VER" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "Four-segment path requires v<semver> (got: ${VER:-empty})"
            exit 1
          fi

          if [ ! -f "src/${DIR}/Dockerfile" ]; then
            echo "Missing src/${DIR}/Dockerfile"
            exit 1
          fi

          TAG=$(printf '%s-%s\n' "$(printf '%s' "$DIR" | tr '/' '-')" "$VER" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$(printf 'ghcr.io/%s/web:%s\n' "${{ github.repository_owner }}" "$TAG" | tr '[:upper:]' '[:lower:]')

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "Building src/${DIR}/Dockerfile as ${IMAGE_ID}"

      - name: Check OS Env
        if: steps.parse.outputs.skip != 'true'
        run: |
          localectl status
          cat /proc/cpuinfo
          free -m

      - name: Login to ghcr
        if: steps.parse.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image
        if: steps.parse.outputs.skip != 'true'
        run: docker build -f "src/${DIR}/Dockerfile" -t "$IMAGE_ID" .

      - run: docker image ls
        if: steps.parse.outputs.skip != 'true'

      - name: Push Image
        if: steps.parse.outputs.skip != 'true'
        run: docker push "$IMAGE_ID"
