name: release

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build from src path
    if: "contains(github.event.head_commit.message, 'release ')"

    runs-on: ubuntu-24.04

    env:
      GIT_MSG: ${{ github.event.head_commit.message }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Parse release path
        id: parse
        run: |
          set -eu
          REST=$(printf '%s\n' "$GIT_MSG" | awk '{
            for (i = 1; i <= NF; i++) {
              if ($i == "release") {
                print $(i + 1), $(i + 2)
                exit
              }
            }
          }')
          SRC_PATH=$(printf '%s\n' "$REST" | awk '{print $1}')
          VER=$(printf '%s\n' "$REST" | awk '{print $2}')

          if [ -z "$SRC_PATH" ]; then
            echo "No release token found; skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s\n' "$SRC_PATH" | grep -qE '^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$'; then
            echo "Not a four-segment path ($SRC_PATH); skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "/$SRC_PATH/" in
            */./*|*/../*)
              echo "Invalid path segment in $SRC_PATH"
              exit 1
              ;;
          esac

          if ! printf '%s\n' "$VER" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "Four-segment path requires v<semver> (got: ${VER:-empty})"
            exit 1
          fi

          if [ ! -f "src/${SRC_PATH}/Dockerfile" ]; then
            echo "Missing src/${SRC_PATH}/Dockerfile"
            exit 1
          fi

          IMAGE_TAG=$(printf '%s\n' "$SRC_PATH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE_ID=$(printf 'ghcr.io/%s/docker-images:%s\n' "${{ github.repository_owner }}" "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_USER=$(printf '%s\n' "${{ secrets.DOCHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_IMAGE_ID=$(printf '%s/docker-images:%s\n' "$DOCKERHUB_USER" "$IMAGE_TAG")

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "SRC_PATH=$SRC_PATH" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE_ID=$GHCR_IMAGE_ID" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE_ID=$DOCKERHUB_IMAGE_ID" >> "$GITHUB_ENV"
          echo "Building src/${SRC_PATH}/Dockerfile as ${GHCR_IMAGE_ID} and ${DOCKERHUB_IMAGE_ID}"

      - name: Check OS Env
        if: steps.parse.outputs.skip != 'true'
        run: |
          localectl status
          cat /proc/cpuinfo
          free -m

      - name: Login to GHCR
        if: steps.parse.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to Docker Hub
        if: steps.parse.outputs.skip != 'true'
        run: echo "${{ secrets.DOCHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCHUB_USERNAME }}" --password-stdin

      - name: Build Image
        if: steps.parse.outputs.skip != 'true'
        run: docker build -f "src/${SRC_PATH}/Dockerfile" -t "$GHCR_IMAGE_ID" -t "$DOCKERHUB_IMAGE_ID" .

      - run: docker image ls
        if: steps.parse.outputs.skip != 'true'

      - name: Push Images
        if: steps.parse.outputs.skip != 'true'
        run: |
          docker push "$GHCR_IMAGE_ID"
          docker push "$DOCKERHUB_IMAGE_ID"
